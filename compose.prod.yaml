name: nickhosting-prod

# Configuration only. Immutable image digests and a separate deployment approval required.
x-app: &app
  image: ${NH_PROD_APP_IMAGE:?Immutable production app image required}
  env_file: ["${NH_PROD_ENV_FILE:-.env.prod.local}"]
  environment: { NH_DEPLOYMENT_ENV: production }
  user: "1000:1000"
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 90s
  pids_limit: 128
  mem_limit: 768m
  cpus: 1
  networks: [data, egress]
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

services:
  web:
    image: ${NH_PROD_WEB_IMAGE:?Immutable production web image required}
    container_name: nickhosting-prod-web
    environment: { NH_PUBLIC_URL: "${NH_PROD_PUBLIC_URL:?HTTPS production origin required}" }
    networks:
      edge: {}
      frontend: { aliases: [nickhosting-prod-web] }
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 90s
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  api:
    <<: *app
    command: [api]
    networks: [edge, data, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: &app-data
      - { type: bind, source: ./mountdata/prod/app, target: /app/mountdata, bind: { create_host_path: false } }
    healthcheck:
      test: [CMD, node, deploy/container-health.mjs, api]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  worker:
    <<: *app
    command: [worker]
    depends_on:
      api: { condition: service_healthy }
    volumes: *app-data
    healthcheck:
      test: [CMD, node, deploy/container-health.mjs, worker]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
  migrate:
    <<: *app
    profiles: [tools]
    command: [migrate]
    networks: [data]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: nickhosting_prod
      POSTGRES_DB: nickhosting_prod
      POSTGRES_PASSWORD: ${NH_PROD_DB_PASSWORD:?Dedicated production database password required}
    volumes:
      - { type: bind, source: ./mountdata/prod/postgres, target: /var/lib/postgresql, bind: { create_host_path: false } }
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 768m
    cpus: 1
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nickhosting_prod -d nickhosting_prod]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    environment: { REDIS_PASSWORD: "${NH_PROD_REDIS_PASSWORD:?Dedicated production Redis password required}" }
    command: [/bin/sh, -c, 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - { type: bind, source: ./mountdata/prod/redis, target: /data, bind: { create_host_path: false } }
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 384m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15
networks:
  edge: { name: nickhosting-prod-edge, internal: true }
  data: { name: nickhosting-prod-data, internal: true }
  # Only API/worker need explicitly configured provider/mail egress. No published ports.
  egress: { name: nickhosting-prod-egress }
  frontend: { name: prod-frontend, external: true }
