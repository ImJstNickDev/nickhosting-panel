name: nickhosting-m1-tests

# Requires explicit Owner approval before creating containers or this network.
# Test-only credentials come from a gitignored environment file.
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: nickhosting_test
      POSTGRES_DB: nickhosting_test
      POSTGRES_PASSWORD: ${NH_TEST_POSTGRES_PASSWORD:?Set an isolated test password}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - ./mountdata/m1-tests/postgres:/var/lib/postgresql
    mem_limit: 384m
    cpus: 1
    restart: "no"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nickhosting_test -d nickhosting_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    environment:
      REDIS_PASSWORD: ${NH_TEST_REDIS_PASSWORD:?Set an isolated test password}
    command: [/bin/sh, -c, 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1::6379"
    volumes:
      - ./mountdata/m1-tests/redis:/data
    mem_limit: 192m
    cpus: 1
    restart: "no"
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 2s
      retries: 30
networks:
  default:
    internal: true
