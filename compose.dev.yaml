name: nickhosting-dev

# Configuration only until the exact activation proposal receives Owner approval.
x-app: &app
  image: nickhosting-dev-app:local
  build: { context: ., target: development }
  user: "${NH_DEV_UID:?Development UID required}:${NH_DEV_GID:?Development GID required}"
  env_file: ["${NH_DEV_ENV_FILE:-.env.dev.local}"]
  environment: { NH_DEPLOYMENT_ENV: development }
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 90s
  pids_limit: 128
  mem_limit: 512m
  cpus: 1
  networks: [data]
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

services:
  web:
    image: nickhosting-dev-web:local
    build: { context: ., target: dev-web }
    container_name: nickhosting-dev-web
    environment: { NH_PUBLIC_URL: "${NH_DEV_PUBLIC_URL:?HTTPS development origin required}" }
    networks:
      edge: {}
      frontend: { aliases: [nickhosting-dev-web] }
    depends_on:
      api: { condition: service_healthy }
      vite: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 90s
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  vite:
    <<: *app
    # No API, database or provider secrets enter the frontend container.
    env_file: []
    environment:
      NH_DEPLOYMENT_ENV: development
      NH_PUBLIC_URL: ${NH_DEV_PUBLIC_URL:?HTTPS development origin required}
      NH_WEB_EXTERNAL_HTTPS: "1"
      NH_WEB_BIND_HOST: 0.0.0.0
      NH_WEB_PORT: "5173"
      NH_WEB_CACHE_DIR: /tmp/vite-cache
    command: [web]
    networks: [edge]
    mem_limit: 768m
    volumes: &sources
      - { type: bind, source: ./apps/web/src, target: /app/apps/web/src, bind: { create_host_path: false } }
      - { type: bind, source: ./apps/web/index.html, target: /app/apps/web/index.html, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./apps/web/vite.config.ts, target: /app/apps/web/vite.config.ts, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./apps/web/vite-network.ts, target: /app/apps/web/vite-network.ts, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./scripts/compile-web-i18n.ts, target: /app/scripts/compile-web-i18n.ts, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./tsconfig.json, target: /app/tsconfig.json, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/auth/src, target: /app/packages/auth/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/content-providers/src, target: /app/packages/content-providers/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/core/src, target: /app/packages/core/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/database/src, target: /app/packages/database/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/external-services/src, target: /app/packages/external-services/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/game-sdk/src, target: /app/packages/game-sdk/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/gateway-safety/src, target: /app/packages/gateway-safety/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/i18n/src, target: /app/packages/i18n/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/jobs/src, target: /app/packages/jobs/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/pterodactyl-adapter/src, target: /app/packages/pterodactyl-adapter/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/server-management/src, target: /app/packages/server-management/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./games/minecraft/src, target: /app/games/minecraft/src, read_only: true, bind: { create_host_path: false } }
    healthcheck:
      test: [CMD, node, deploy/container-health.mjs, web]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  api:
    <<: *app
    command: [api]
    networks: [edge, data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      provider: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    volumes: &backend
      - { type: bind, source: ./packages/auth/src, target: /app/packages/auth/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/content-providers/src, target: /app/packages/content-providers/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/core/src, target: /app/packages/core/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/database/src, target: /app/packages/database/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/external-services/src, target: /app/packages/external-services/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/game-sdk/src, target: /app/packages/game-sdk/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/gateway-safety/src, target: /app/packages/gateway-safety/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/i18n/src, target: /app/packages/i18n/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/jobs/src, target: /app/packages/jobs/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/pterodactyl-adapter/src, target: /app/packages/pterodactyl-adapter/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./packages/server-management/src, target: /app/packages/server-management/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./games/minecraft/src, target: /app/games/minecraft/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./apps/api/src, target: /app/apps/api/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./apps/worker/src, target: /app/apps/worker/src, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./tsconfig.json, target: /app/tsconfig.json, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./mountdata/dev/app, target: /app/mountdata, bind: { create_host_path: false } }
      - { type: bind, source: ./mountdata/dev/mail-tls/cert.pem, target: /run/dev-mail/cert.pem, read_only: true, bind: { create_host_path: false } }
    healthcheck:
      test: [CMD, node, deploy/container-health.mjs, api]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  worker:
    <<: *app
    command: [worker]
    depends_on:
      api: { condition: service_healthy }
    volumes: *backend
    healthcheck:
      test: [CMD, node, --import, tsx, deploy/container-health.mjs, worker]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
  migrate:
    <<: *app
    profiles: [tools]
    command: [migrate]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    # Explicit command only; SQL is image-baked. Match the scoped SMTP trust path.
    volumes:
      - { type: bind, source: ./mountdata/dev/mail-tls/cert.pem, target: /run/dev-mail/cert.pem, read_only: true, bind: { create_host_path: false } }
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: nickhosting_dev
      POSTGRES_DB: nickhosting_dev
      POSTGRES_PASSWORD: ${NH_DEV_DB_PASSWORD:?Dedicated database password required}
    volumes:
      - { type: bind, source: ./mountdata/dev/postgres, target: /var/lib/postgresql, bind: { create_host_path: false } }
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 384m
    cpus: 1
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nickhosting_dev -d nickhosting_dev]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    environment: { REDIS_PASSWORD: "${NH_DEV_REDIS_PASSWORD:?Dedicated Redis password required}" }
    command: [/bin/sh, -c, 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - { type: bind, source: ./mountdata/dev/redis, target: /data, bind: { create_host_path: false } }
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 192m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15
  provider:
    <<: *app
    env_file: []
    environment: { NH_DEV_SANDBOX_TOKEN: "${NH_DEV_SANDBOX_TOKEN:?Dedicated simulator token required}" }
    entrypoint: [node, deploy/dev-provider.mjs]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    user: "${NH_DEV_UID:?Development UID required}:${NH_DEV_GID:?Development GID required}"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
      MP_SMTP_AUTH_FILE: /run/mail-tls/smtp-auth
      MP_SMTP_TLS_CERT: /run/mail-tls/cert.pem
      MP_SMTP_TLS_KEY: /run/mail-tls/key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_ALLOWED_HOSTS: mailpit,127.0.0.1,localhost
      MP_QUIET: "true"
    volumes:
      - { type: bind, source: ./mountdata/dev/mail, target: /data, bind: { create_host_path: false } }
      - { type: bind, source: ./mountdata/dev/mail-tls, target: /run/mail-tls, read_only: true, bind: { create_host_path: false } }
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  edge: { name: nickhosting-dev-edge, internal: true }
  data: { name: nickhosting-dev-data, internal: true }
  frontend: { name: prod-frontend, external: true }
