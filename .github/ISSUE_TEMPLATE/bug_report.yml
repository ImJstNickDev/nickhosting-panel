name: Bug report
description: Report a reproducible NickHosting Panel defect
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens? Avoid including secrets or player data.
      placeholder: Describe the observed problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe the expected outcome
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Numbered steps, versions and safe fixtures
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, evidence and affected game/version (sanitized)
      description: Never post tokens, credentials, private addresses with secrets, or existing player data.
    validations:
      required: false
